<style>
    /* Header container */
    .main-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 30px;
        background: linear-gradient(to left, #d60000, #b00000);
        border-bottom: 5px solid #c9a44a;
        flex-wrap: wrap;
    }

    /* Logo */
    .main-header img {
        width: 80px;
        height: auto;
        margin-left: 15px;
    }

    /* Titles */
    .site-title h1 {
        margin: 0;
        font-family: 'Jameel Noori Nastaleeq';

        color: white;
    }

    .site-title h3 {
        margin: 0;
        font-size: 18px;
        color: #ffeec2;
    }

    /* Navigation */
    nav.main-nav {
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    nav.main-nav a {
        color: #ffeec2;
        text-decoration: none;
        font-size: 18px;
        padding: 8px 14px;
        border-radius: 6px;
        transition: background 0.3s, color 0.3s;
        white-space: nowrap;
    }

    nav.main-nav a:hover {
        background: #ffd27f;
        color: #b00000;
    }

    nav.main-nav a.active {
        background: #ffd27f;
        color: #b00000;
        font-weight: bold;
    }

    /* Social links */
    .social-links {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: 10px;
        flex-wrap: wrap;
    }

    .social-links a {
        color: #ffeec2;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #ffeec2;
        transition: background 0.3s, color 0.3s;
        white-space: nowrap;
    }

    .social-links a:hover {
        background: #ffd27f;
        color: #b00000;
    }

    /* Responsive collapse */
    @media (max-width: 700px) {
        .main-header {
            flex-direction: column;
            align-items: flex-start;
        }

        nav.main-nav {
            flex-direction: column;
            align-items: flex-start;
            margin-top: 10px;
        }

        .social-links {
            margin-top: 10px;
        }
    }
</style>
