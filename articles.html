<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Articles – مضامین</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js"></script>
</head>

<body>

    <div id="header"></div>
    <script>
        fetch("header.html")
            .then(r => r.text())
            .then(h => document.getElementById("header").innerHTML = h);
    </script>

    <div class="container">

        <div class="sidebar">
            <h3>مضامین</h3>

            <input type="text" id="search" placeholder="مضمون تلاش کریں…" onkeyup="filterArticles()">

            <ul>
                <li onclick="loadArticle('article-01')">ہستی باری تعالیٰ</li>
                <li onclick="loadArticle('article-02')">رسول اللہ ﷺ کا جذبہ ایثار و قربانی</li>
                <li onclick="loadArticle('article-03')">سیرتِ نبوی ﷺ — رحمۃ للعالمین</li>
            </ul>
        </div>

        <div class="viewer" id="articleContent">
            <h2>مضمون منتخب کریں</h2>
            <p>براہِ کرم دائیں جانب سے کوئی مضمون منتخب کریں۔</p>
        </div>

    </div>

    <div id="footer"></div>
    <script>
        fetch("footer.html")
            .then(r => r.text())
            .then(f => document.getElementById("footer").innerHTML = f);
    </script>

</body>
</html>
